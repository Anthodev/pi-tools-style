name: Publish npm package
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test tagged commit on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.x
    env:
      CI: true
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit
        shell: bash
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$head_commit" = "$GITHUB_SHA"
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "Tagged commit must belong to develop" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run checks
        run: npm run check

  publication-checks:
    name: Check package publication
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm version
        run: |
          node --input-type=module - "$(npm --version)" <<'EOF'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);

          if (
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error("Trusted Publishing requires npm >= 11.5.1");
          }
          EOF

      - name: Verify release metadata
        env:
          EXPECTED_PACKAGE_NAME: "@anthodev/pi-tools-style"
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Anthodev/pi-tools-style.git"
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expectedTag = `v${pkg.version}`;

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must equal ${expectedTag}`);
          }
          if (pkg.name !== process.env.EXPECTED_PACKAGE_NAME) {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (pkg.repository?.url !== process.env.EXPECTED_REPOSITORY_URL) {
            throw new Error(`Unexpected repository URL: ${pkg.repository?.url}`);
          }
          if (lock.name !== pkg.name || lock.version !== pkg.version) {
            throw new Error("Top-level package-lock metadata does not match package.json");
          }
          if (lock.packages?.[""]?.name !== pkg.name || lock.packages?.[""]?.version !== pkg.version) {
            throw new Error("Root package-lock metadata does not match package.json");
          }
          EOF

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify package contents
        run: npm run pack:check

      - name: Dry-run publication
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Build publication tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > pack-result.json
          tarball="$(node -e 'const result = require("./pack-result.json"); process.stdout.write(result[0].filename)')"
          test -n "$tarball"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Hash publication tarball
        id: hash
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          test -n "$sha256"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Upload publication tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish package
    needs: publication-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download publication tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package

      - name: Verify publication tarball integrity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.publication-checks.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          echo "$EXPECTED_SHA256  ${tarballs[0]}" | sha256sum --check --strict -
      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          npm publish "${tarballs[0]}" --ignore-scripts --access public --provenance

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
          else
            range="$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi

          RANGE="$range" CHANGELOG_URL="$changelog_url" node --input-type=module <<'EOF'
          import { execFileSync } from "node:child_process";
          import { writeFileSync } from "node:fs";

          const groups = [
            { key: "feat", title: "Features", commits: [] },
            { key: "change", title: "Changes", commits: [] },
            { key: "fix", title: "Fixes", commits: [] },
            { key: "ci", title: "CI", commits: [] },
          ];
          const byKey = new Map(groups.map((group) => [group.key, group]));
          const fields = execFileSync(
            "git",
            ["log", "--first-parent", "-z", "--format=%s%x00%h", process.env.RANGE],
            { encoding: "utf8" },
          ).split("\0").filter(Boolean);

          for (let index = 0; index < fields.length; index += 2) {
            const subject = fields[index].trim();
            const hash = fields[index + 1].trim();
            const type = subject.match(/^([a-z]+)(?:\([^)]*\))?!?:\s+/i)?.[1].toLowerCase();
            const key = type === "feat"
              ? "feat"
              : type === "fix"
                ? "fix"
                : type === "ci"
                  ? "ci"
                  : "change";

            byKey.get(key).commits.push(`- ${subject} (\`${hash}\`)`);
          }

          const notes = [];
          for (const group of groups) {
            if (group.commits.length === 0) continue;
            notes.push(`## ${group.title}`, "", ...group.commits, "");
          }
          notes.push(`**Full changelog**: ${process.env.CHANGELOG_URL}`, "");
          writeFileSync("release-notes.md", notes.join("\n"));
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            options+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${options[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
