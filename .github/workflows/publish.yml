name: Publish npm package
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.x
    env:
      CI: true
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit
        shell: bash
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$head_commit" = "$GITHUB_SHA"
          test "$tag_commit" = "$GITHUB_SHA"
          git fetch --no-tags origin develop:refs/remotes/origin/develop
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "Tagged commit must belong to develop" >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Validate release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          node scripts/generate-release-notes.ts "$GITHUB_REF_NAME" "$GITHUB_SHA" "$notes"
          test -s "$notes"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Run checks
        shell: bash
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent-dir
        run: |
          set -euo pipefail
          mkdir -p "$PI_CODING_AGENT_DIR"
          npm run check

  publication-checks:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball-sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm version
        run: |
          node --input-type=module - "$(npm --version)" <<'EOF'
          const [major, minor, patch] = process.argv[2].split(".").map(Number);

          if (
            major < 11 ||
            (major === 11 && minor < 5) ||
            (major === 11 && minor === 5 && patch < 1)
          ) {
            throw new Error("Trusted Publishing requires npm >= 11.5.1");
          }
          EOF

      - name: Verify release metadata
        env:
          EXPECTED_PACKAGE_NAME: "@anthodev/pi-tools-style"
          EXPECTED_REPOSITORY_URL: "git+https://github.com/Anthodev/pi-tools-style.git"
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const expectedTag = `v${pkg.version}`;

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must equal ${expectedTag}`);
          }
          if (pkg.name !== process.env.EXPECTED_PACKAGE_NAME) {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (pkg.repository?.url !== process.env.EXPECTED_REPOSITORY_URL) {
            throw new Error(`Unexpected repository URL: ${pkg.repository?.url}`);
          }
          if (lock.name !== pkg.name || lock.version !== pkg.version) {
            throw new Error("Top-level package-lock metadata does not match package.json");
          }
          if (lock.packages?.[""]?.name !== pkg.name || lock.packages?.[""]?.version !== pkg.version) {
            throw new Error("Root package-lock metadata does not match package.json");
          }
          EOF

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Verify package contents
        run: npm run pack:check

      - name: Dry-run publication
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Build publication tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          npm pack --json --ignore-scripts > pack-result.json
          tarball="$(node -e 'const result = require("./pack-result.json"); process.stdout.write(result[0].filename)')"
          test -n "$tarball"
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Hash publication tarball
        id: hash
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          test -n "$sha256"
          printf '%s  %s\n' "$sha256" "$(basename "$TARBALL")" > SHA256SUMS
          cat SHA256SUMS
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload publication tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            ${{ steps.pack.outputs.tarball }}
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish npm package
    needs: publication-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download publication tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package

      - name: Verify publication tarball integrity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.publication-checks.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          test -f package/SHA256SUMS
          test "$(cut -d' ' -f1 package/SHA256SUMS)" = "$EXPECTED_SHA256"
          echo "$EXPECTED_SHA256  ${tarballs[0]}" | sha256sum --check --strict -
          (cd package && sha256sum --check --strict SHA256SUMS)

      - name: Publish package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          npm publish "./${tarballs[0]}" --ignore-scripts --access public --provenance

  release:
    name: Create GitHub release
    needs:
      - publish
      - publication-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Download publication tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package

      - name: Verify publication tarball integrity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.publication-checks.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          test -f package/SHA256SUMS
          test "$(cut -d' ' -f1 package/SHA256SUMS)" = "$EXPECTED_SHA256"
          echo "$EXPECTED_SHA256  ${tarballs[0]}" | sha256sum --check --strict -
          (cd package && sha256sum --check --strict SHA256SUMS)

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.ts "$RELEASE_TAG" "$RELEASE_SHA" release-notes.md
          test -s release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${tarballs[0]}" package/SHA256SUMS
